name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@v5
      - name: Install RPM build tooling
        run: dnf -y install dnf-plugins-core rpm-build rpmdevtools
      - name: Install spec build requirements
        run: dnf -y builddep mouse-control.spec
      - name: Build RPMs
        run: |
          python3 -m build --sdist
          rpmbuild -ba mouse-control.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpms" --define "_srcrpmdir $PWD/rpms"
          test -f rpms/noarch/mouse-control-0.8.2-1.fc44.noarch.rpm
          rpm -qp --info rpms/noarch/mouse-control-0.8.2-1.fc44.noarch.rpm
      - uses: actions/upload-artifact@v5
        with:
          name: rpm-packages
          path: rpms/
          if-no-files-found: error
