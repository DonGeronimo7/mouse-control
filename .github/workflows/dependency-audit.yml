name: Dependency audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions: read-all

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
          cache: pip
      - name: Create resolved audit environment
        run: |
          python -m venv .audit-venv
          .audit-venv/bin/python -m pip install --require-hashes --requirement requirements/security.lock.txt
      - name: Audit runtime, build, test, and security dependencies
        run: .audit-venv/bin/python -m pip_audit --local --strict --progress-spinner off
