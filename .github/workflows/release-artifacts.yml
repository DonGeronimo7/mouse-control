name: Release artifacts

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions: read-all

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --require-hashes --requirement requirements/ci.lock.txt
      - run: python -m pytest -q
      - run: python -m compileall -q src tests

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - run: python -m pip install --require-hashes --requirement requirements/build.lock.txt
      - run: python -m build --no-isolation
      - name: Smoke-test installed wheel CPI command
        run: |
          python -m pip install --require-hashes --requirement requirements/runtime.lock.txt
          python -m pip install --no-deps dist/*.whl
          mouse-control cpi --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error

  deb:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Debian build dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential debhelper dh-python pybuild-plugin-pyproject python3-all python3-setuptools python3-evdev python3-dbus-next python3-packaging
      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir artifacts
          mv ../mouse-control_*.deb artifacts/
          sudo apt-get install -y ./artifacts/mouse-control_*.deb
          mouse-control cpi --help
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: debian-package
          path: artifacts/*.deb
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    container: fedora:44
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: dnf -y install dnf-plugins-core rpm-build rpmdevtools
      - run: dnf -y builddep mouse-control.spec
      - run: |
          python3 -m build --sdist
          rpmbuild -ba mouse-control.spec --define "_sourcedir $PWD/dist" --define "_rpmdir $PWD/rpms" --define "_srcrpmdir $PWD/rpms"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpm
          path: rpms/noarch/mouse-control-*.rpm
          if-no-files-found: error

  appimage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install AppImage build prerequisites
        run: sudo apt-get update && sudo apt-get install -y python3-pip libfuse2 build-essential
      - name: Install AppImageKit 13
        run: |
          curl --fail --location --retry 3 --output /tmp/appimagetool.AppImage https://github.com/AppImage/AppImageKit/releases/download/13/obsolete-appimagetool-x86_64.AppImage
          echo 'df3baf5ca5facbecfc2f3fa6713c29ab9cefa8fd8c1eac5d283b79cab33e4acb  /tmp/appimagetool.AppImage' | sha256sum --check --strict -
          chmod +x /tmp/appimagetool.AppImage
          sudo ln -s /tmp/appimagetool.AppImage /usr/local/bin/appimagetool
      - name: Build AppImage
        run: ARCH=x86_64 sh packaging/appimage/build-appimage.sh
      - name: Smoke-test AppImage
        run: |
          APPIMAGE_EXTRACT_AND_RUN=1 ./Mouse-Control-*-x86_64.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 ./Mouse-Control-*-x86_64.AppImage --help
          APPIMAGE_EXTRACT_AND_RUN=1 ./Mouse-Control-*-x86_64.AppImage cpi --help
          APPIMAGE_EXTRACT_AND_RUN=1 ./Mouse-Control-*-x86_64.AppImage update --check
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appimage
          path: Mouse-Control-*.AppImage
          if-no-files-found: error

  publish:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: [test, python, deb, rpm, appimage]
    runs-on: ubuntu-latest
    permissions:
      artifact-metadata: write
      attestations: write
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Use the lock-generation Python for publication tools
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-assets
          merge-multiple: true
      - name: Verify tag and primary release artifacts
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release_field() { PYTHONPATH=src python3 -m mouse_control.release_version "$version" "$1"; }
          base_version=$(release_field rpm-version)
          package_release=$(release_field rpm-release)
          python_version=$(release_field python-version)
          test "$GITHUB_REF_NAME" = "v${version}"
          test -f "release-assets/mouse-control-${base_version}-${package_release}.fc44.noarch.rpm"
          test -f "release-assets/mouse-control_${version}_all.deb"
          test -f "release-assets/Mouse-Control-${version}-x86_64.AppImage"
          test -f "release-assets/mouse_control-${python_version}-py3-none-any.whl"
          test -f "release-assets/mouse_control-${python_version}.tar.gz"
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/release-files
          printf '%s\n' \
            "Mouse-Control-${version}-x86_64.AppImage" \
            "mouse-control-${base_version}-${package_release}.fc44.noarch.rpm" \
            "mouse-control_${version}_all.deb" \
            "mouse_control-${python_version}-py3-none-any.whl" \
            "mouse_control-${python_version}.tar.gz" | LC_ALL=C sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/release-files
          ls -lah release-assets
      - name: Generate project dependency SBOM
        id: sbom
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          python3 -m venv /tmp/mouse-control-sbom-tool
          /tmp/mouse-control-sbom-tool/bin/python -m pip install --require-hashes --requirement requirements/sbom.lock.txt
          python3 -m venv /tmp/mouse-control-release-environment
          /tmp/mouse-control-release-environment/bin/python -m pip install --require-hashes --requirement requirements/runtime.lock.txt
          /tmp/mouse-control-release-environment/bin/python -m pip install --no-deps release-assets/*.whl
          /tmp/mouse-control-release-environment/bin/python -m pip uninstall --yes pip setuptools
          /tmp/mouse-control-sbom-tool/bin/cyclonedx-py environment \
            /tmp/mouse-control-release-environment/bin/python \
            --pyproject pyproject.toml \
            --mc-type application \
            --spec-version 1.6 \
            --output-reproducible \
            --output-format JSON \
            --output-file "release-assets/mouse-control-${version}.cdx.json"
          python3 scripts/finalize_cyclonedx_sbom.py \
            "release-assets/mouse-control-${version}.cdx.json" "$version"
          python3 -m json.tool "release-assets/mouse-control-${version}.cdx.json" >/dev/null
          printf 'path=release-assets/mouse-control-%s.cdx.json\n' "$version" >> "$GITHUB_OUTPUT"
      - name: Finalize and verify release checksums
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          release_field() { PYTHONPATH=src python3 -m mouse_control.release_version "$version" "$1"; }
          base_version=$(release_field rpm-version)
          package_release=$(release_field rpm-release)
          python_version=$(release_field python-version)
          find release-assets -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort > /tmp/release-files
          printf '%s\n' \
            "Mouse-Control-${version}-x86_64.AppImage" \
            "mouse-control-${base_version}-${package_release}.fc44.noarch.rpm" \
            "mouse-control-${version}.cdx.json" \
            "mouse-control_${version}_all.deb" \
            "mouse_control-${python_version}-py3-none-any.whl" \
            "mouse_control-${python_version}.tar.gz" | LC_ALL=C sort > /tmp/expected-files
          diff -u /tmp/expected-files /tmp/release-files
          (cd release-assets && sha256sum * > SHA256SUMS)
          (cd release-assets && sha256sum --check --strict SHA256SUMS)
          grep -v '\.cdx\.json$' release-assets/SHA256SUMS > /tmp/release-subjects.sha256
      - name: Attest final release artifact provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: release-assets/SHA256SUMS
      - name: Bind project SBOM to primary release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: /tmp/release-subjects.sha256
          sbom-path: ${{ steps.sbom.outputs.path }}
      - name: Export and verify SLSA provenance release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          provenance="release-assets/mouse-control-v${version}.intoto.jsonl"
          subject="release-assets/mouse-control-${version}.cdx.json"
          bundle_dir=$(mktemp -d)
          trap 'rm -rf "$bundle_dir"' EXIT
          for attempt in 1 2 3 4 5; do
            if (cd "$bundle_dir" && gh attestation download \
                "$GITHUB_WORKSPACE/$subject" \
                --repo "$GITHUB_REPOSITORY" \
                --predicate-type https://slsa.dev/provenance/v1); then
              break
            fi
            test "$attempt" -lt 5
            sleep 2
          done
          test "$(find "$bundle_dir" -maxdepth 1 -type f -name '*.jsonl' | wc -l)" -eq 1
          bundle=$(find "$bundle_dir" -maxdepth 1 -type f -name '*.jsonl' -print -quit)
          jq -e -c . "$bundle" >/dev/null
          mv "$bundle" "$provenance"
          while read -r _ artifact; do
            gh attestation verify "release-assets/$artifact" \
              --repo "$GITHUB_REPOSITORY" \
              --bundle "$provenance" \
              --predicate-type https://slsa.dev/provenance/v1 \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifacts.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" >/dev/null
          done < release-assets/SHA256SUMS
          ! grep -F "$(basename "$provenance")" release-assets/SHA256SUMS
      - name: Prepare release notes
        run: awk '/^---$/{exit} {print}' RELEASE_NOTES.md > release-body.md
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Mouse Control $GITHUB_REF_NAME" \
            --notes-file release-body.md \
            --verify-tag

  dispatch-virustotal:
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch VirusTotal verification for the published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run virustotal-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field tag="$GITHUB_REF_NAME"
